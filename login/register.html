<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Minimalism Login</title>
    <meta name="description" content="Warm minimalism login form with organic curves and gentle press feedback.">
    <meta name="author" content="Aigars Silkalns / Colorlib">
    <link rel="canonical" href="https://puikinsh.github.io/login-forms/forms/soft-minimalism/">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236366f1'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>L</text></svg>">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Soft Minimalism Login Form">
    <meta property="og:description" content="Warm minimalism login form with organic curves and gentle press feedback.">
    <meta property="og:url" content="https://puikinsh.github.io/login-forms/forms/soft-minimalism/">
    <meta property="og:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/soft-minimalism.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Soft Minimalism Login Form">
    <meta name="twitter:description" content="Warm minimalism login form with organic curves and gentle press feedback.">
    <meta name="twitter:image" content="https://puikinsh.github.io/login-forms/assets/screenshots/soft-minimalism.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="soft-card">

            <div class="comfort-header">
                <h1 class="comfort-title">Hiiiiiiiiiiiii </h1>
                <p class="gentle-subtitle">
                    Buat akun agar dapat diskon
                </p>
            </div>

            <!-- REGISTER FORM -->
            <form class="comfort-form" id="registerForm" novalidate>

                <!-- USERNAME -->
                <div class="soft-field">

                    <div class="field-container">

                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autocomplete="username">

                        <label for="username">
                            Nama Pengguna
                        </label>

                        <div class="field-accent"></div>

                    </div>

                    <span class="gentle-error" id="usernameError"></span>

                </div>

                <!-- EMAIL -->
                <div class="soft-field">

                    <div class="field-container">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="field-accent"></div>

                    </div>

                    <span class="gentle-error" id="emailError"></span>

                </div>

                <!-- PASSWORD -->
                <div class="soft-field">

                    <div class="field-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password">

                        <label for="password">
                            Password
                        </label>

                        <!-- TOGGLE PASSWORD -->
                        <button
                            type="button"
                            class="gentle-toggle"
                            id="passwordToggle"
                            aria-label="Toggle password visibility">

                            0

                        </button>

                        <div class="field-accent"></div>

                    </div>

                    <span class="gentle-error" id="passwordError"></span>

                </div>

                <!-- CHECKBOX -->
                <div class="comfort-options">

                    <label class="gentle-checkbox">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            required>

                        <span class="checkbox-text">
                            Saya setuju
                        </span>

                    </label>

                    <a href="#" class="comfort-link">
                        S&K
                    </a>

                </div>

                <!-- BUTTON -->
                <button type="submit" class="comfort-button">

                    <span class="button-text">
                        Buat Akun
                    </span>

                </button>

                <!-- MESSAGE -->
                <p id="message"></p>

            </form>

            <!-- LOGIN -->
            <div class="comfort-signup">

                <span class="signup-text">
                    Udah punya akun?
                </span>

                <a
                    href="index.html"
                    class="comfort-link signup-link">

                    Sign In

                </a>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="js/register.js"></script>

</body>
</html>
